name: mythos
description: Mythos, aventuras narrativas interactivas.
publish_to: none
version: 1.2.3+5

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.8.1
  flutter_svg: ^2.2.0
  audioplayers: ^6.4.0
  shared_preferences: ^2.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/stories/stories.json
    - assets/stories/index.json
    - assets/stories/content/
    - assets/images/
    - assets/branding/chiguire_grove_isotipo_original_trazado.svg
